<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏥 医療カンファレンス AI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; }
  @keyframes pulse  { 0%,100%{opacity:1} 50%{opacity:0.2} }
  @keyframes fadeUp { from{opacity:0;transform:translateY(7px)} to{opacity:1;transform:translateY(0)} }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-thumb { background: #252d3d; border-radius: 3px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ============================================================
// メンバー定義
// isOrchestrator: 議論を司る進行役
// defaultOn: 初期表示でONにするか
// ============================================================
const ALL_AGENTS = [
  {
    id: "doctor", name: "主治医", nameEn: "Physician", initial: "医", role: "主治医",
    color: "#2a6496", textColor: "#6baed6", bgAlpha: "rgba(42,100,150,0.15)",
    defaultOn: true, isOrchestrator: true,
    systemPrompt: `あなたは入院患者を担当する「主治医」です。診断・治療方針・退院計画の最終責任者として発言します。病院薬剤師からの相談に対し、医学的根拠に基づき、他職種の意見を統合しながら方針を示してください。一度の発言は120文字以内で必ず完結させてください。`,
  },
  {
    id: "nurse", name: "看護師", nameEn: "Nurse", initial: "看", role: "看護師",
    color: "#6a4c8a", textColor: "#b07fd4", bgAlpha: "rgba(106,76,138,0.15)",
    defaultOn: true, isOrchestrator: false,
    systemPrompt: `あなたは病棟担当の「看護師」です。患者の日常生活動作・服薬管理・家族支援・退院後の療養環境を中心に発言します。患者の訴えや生活上の問題を現場目線で伝えてください。一度の発言は120文字以内で必ず完結させてください。`,
  },
  {
    id: "pharmacist", name: "薬局薬剤師", nameEn: "Pharmacist", initial: "薬", role: "薬局薬剤師",
    color: "#2e7d52", textColor: "#74c69d", bgAlpha: "rgba(46,125,82,0.15)",
    defaultOn: true, isOrchestrator: false,
    systemPrompt: `あなたは保険薬局の「薬局薬剤師」です。在宅医療・多剤併用・残薬管理・服薬指導・後発品変更の観点から発言します。地域での継続的な服薬支援について具体的に述べてください。一度の発言は120文字以内で必ず完結させてください。`,
  },
  {
    id: "pt", name: "理学療法士", nameEn: "Physical Therapist", initial: "PT", role: "理学療法士",
    color: "#7a5230", textColor: "#d4956a", bgAlpha: "rgba(122,82,48,0.15)",
    defaultOn: true, isOrchestrator: false,
    systemPrompt: `あなたは「理学療法士（PT）」です。患者のADL・身体機能・転倒リスク・リハビリ進捗・退院後の生活環境整備について発言します。機能回復の見通しと在宅復帰に向けた課題を具体的に述べてください。一度の発言は120文字以内で必ず完結させてください。`,
  },
  {
    id: "msw", name: "MSW", nameEn: "Medical Social Worker", initial: "SW", role: "医療ソーシャルワーカー",
    color: "#5a7a3a", textColor: "#90c060", bgAlpha: "rgba(90,122,58,0.15)",
    defaultOn: true, isOrchestrator: false,
    systemPrompt: `あなたは「医療ソーシャルワーカー（MSW）」です。患者・家族の社会的背景・経済状況・退院先の調整・介護保険申請・地域サービスとの連携について発言します。退院後の生活を支える社会資源の活用を提案してください。一度の発言は120文字以内で必ず完結させてください。`,
  },
  {
    id: "cm", name: "ケアマネジャー", nameEn: "Care Manager", initial: "CM", role: "ケアマネジャー",
    color: "#7a6a2a", textColor: "#d4b84a", bgAlpha: "rgba(122,106,42,0.15)",
    defaultOn: false, isOrchestrator: false,
    systemPrompt: `あなたは「ケアマネジャー（介護支援専門員）」です。要介護認定・ケアプラン・在宅サービスの調整・介護者の負担軽減について発言します。地域包括ケアの視点から継続的な支援体制を提案してください。一度の発言は120文字以内で必ず完結させてください。`,
  },
  {
    id: "psychiatrist", name: "精神科医", nameEn: "Psychiatrist", initial: "精", role: "精神科医",
    color: "#6a3a6a", textColor: "#c07ac0", bgAlpha: "rgba(106,58,106,0.15)",
    defaultOn: false, isOrchestrator: false,
    systemPrompt: `あなたは「精神科医」です。患者の精神症状・認知機能・せん妄・うつ・不安・向精神薬の適正使用について発言します。身体疾患と精神症状の関連を踏まえた包括的な視点で助言してください。一度の発言は120文字以内で必ず完結させてください。`,
  },
];

const agentsMap = {};
ALL_AGENTS.forEach(a => agentsMap[a.id] = a);
const STORAGE_KEY = "medical_conf_api_key";
const ROUND1_SUFFIX = "病院薬剤師からの相談に対し、あなたの専門の立場から簡潔に初期見解を述べてください。";

// 主治医：議論品質の監視＋次アクション決定
const buildOrchestratorPrompt = (activeMembers) => `あなたは「主治医」として医療カンファレンスの進行役を務めます。
参加メンバー：${activeMembers.map(id => `${agentsMap[id].name}（${agentsMap[id].role}）`).join("、")}。

会話の流れを読んで、以下のいずれかのJSON形式のみで返してください。他の文章は一切不要です。

【介入すべき状況】同じ意見の繰り返し・建設的でない対立・臨床的に不適切な内容が続く場合:
{"action":"intervene","comment":"主治医の介入（話題を整理・方向転換する内容、60文字以内）"}

【全員最低1回発言済み＆議論が十分深まった場合】:
{"action":"done","comment":""}

【上記以外・次に発言させたいメンバーを指名】:
{"action":"direct","target":"メンバーID","comment":"主治医から一言（省略可、30文字以内）"}

メンバーIDは ${activeMembers.filter(id => !agentsMap[id].isOrchestrator).join(" / ")} のいずれか。`;

// 自発的発言判定プロンプト
const SPONTANEOUS_PROMPT = (agentName, agentRole) =>
`あなたは「${agentName}」（${agentRole}）です。
直前の発言を読んで、あなたが今すぐ自発的に発言したいかを判定してください。
以下のJSON形式のみで返してください。他の文章は一切不要です。
{"react":true または false}
trueにする条件：直前の発言に対して専門職として強く同意・反論・補足したい具体的な内容がある場合のみ。
falseにする条件：特に追加することがない、または他の職種の方が適切な場合。`;

function MedicalConference() {
  const [messages, setMessages]           = useState([]);
  const [thinkingAgent, setThinkingAgent] = useState(null);
  const [isRunning, setIsRunning]         = useState(false);
  const [taskInput, setTaskInput]         = useState("");
  const [userNote, setUserNote]           = useState("");
  const [apiKey, setApiKey]               = useState(() => localStorage.getItem(STORAGE_KEY) || "");
  const [showApiKey, setShowApiKey]       = useState(false);
  const [error, setError]                 = useState("");
  const [countdown, setCountdown]         = useState(0);
  const [resumeFrom, setResumeFrom]       = useState(null);
  const [savedContext, setSavedContext]   = useState([]);
  const [round, setRound]                 = useState(1);
  const [keySaved, setKeySaved]           = useState(false);
  const [roundDone, setRoundDone]         = useState(false);
  const [modeLabel, setModeLabel]         = useState("");
  // 各エージェントのON/OFF状態
  const [agentEnabled, setAgentEnabled]   = useState(() => {
    const init = {};
    ALL_AGENTS.forEach(a => init[a.id] = a.defaultOn);
    return init;
  });
  const chatRef = useRef(null);
  const apiKeyRef = useRef(apiKey);
  useEffect(() => { apiKeyRef.current = apiKey; }, [apiKey]);

  useEffect(() => {
    if (chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight;
  }, [messages, thinkingAgent]);

  // ONになっているエージェントのID一覧
  const activeAgents   = ALL_AGENTS.filter(a => agentEnabled[a.id]).map(a => a.id);
  const orchestratorId = ALL_AGENTS.find(a => a.isOrchestrator)?.id || "doctor";
  const activeMembers  = activeAgents.filter(id => !agentsMap[id].isOrchestrator);

  const toggleAgent = (id) => {
    if (isRunning) return;
    if (agentsMap[id].isOrchestrator) return; // 主治医は常時ON
    setAgentEnabled(prev => ({ ...prev, [id]: !prev[id] }));
  };

  const addMsg = msg => setMessages(prev => [...prev, { ...msg, id: Date.now() + Math.random() }]);

  const waitWithCountdown = async sec => {
    for (let i = sec; i > 0; i--) { setCountdown(i); await new Promise(r => setTimeout(r, 1000)); }
    setCountdown(0);
  };

  const callAPI = useCallback(async (msgs, systemPrompt, maxTokens = 300, retryCount = 0) => {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKeyRef.current,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({ model: "claude-haiku-4-5-20251001", max_tokens: maxTokens, system: systemPrompt, messages: msgs }),
    });
    if (res.status === 429 && retryCount < 3) {
      const waitSec = (retryCount + 1) * 12;
      addMsg({ agentId:"system", text:`レートリミット検知。${waitSec}秒待機してリトライします (${retryCount + 1}/3)`, isSystem:true });
      await waitWithCountdown(waitSec);
      return callAPI(msgs, systemPrompt, maxTokens, retryCount + 1);
    }
    if (!res.ok) { const e = await res.json(); throw new Error(e.error?.message || `API Error ${res.status}`); }
    return res.json();
  }, []);

  const callAgent = useCallback(async (agentId, context, extraSuffix = "") => {
    const agent = agentsMap[agentId];
    setThinkingAgent(agentId);
    const msgs = [
      ...context.map(m => ({ role:"user", content:`${m.name}（${m.role}）: ${m.text}` })),
      { role:"user", content:`あなたは${agent.name}（${agent.role}）です。上記の会話を踏まえて返答してください。` },
    ];
    const data = await callAPI(msgs, agent.systemPrompt + extraSuffix, 300);
    setThinkingAgent(null);
    return data.content[0].text;
  }, [callAPI]);

  const checkSpontaneous = useCallback(async (agentId, context) => {
    const agent = agentsMap[agentId];
    const lastMsg = context[context.length - 1];
    if (!lastMsg || lastMsg.agentId === agentId) return false;
    const msgs = [
      { role:"user", content:`直前の発言：${lastMsg.name}（${lastMsg.role}）:「${lastMsg.text}」` },
      { role:"user", content:`あなたは${agent.name}です。この発言に今すぐ反応しますか？` },
    ];
    try {
      const data = await callAPI(msgs, SPONTANEOUS_PROMPT(agent.name, agent.role), 50);
      const raw = data.content[0].text.trim();
      const parsed = JSON.parse(raw.match(/\{.*\}/s)?.[0] || raw);
      return parsed.react === true;
    } catch { return false; }
  }, [callAPI]);

  const askOrchestrator = useCallback(async (context, spokeMembersThisRound, currentActiveMembers) => {
    const msgs = [
      ...context.map(m => ({ role:"user", content:`${m.name}（${m.role}）: ${m.text}` })),
      { role:"user", content:`今ラウンドの発言済みメンバー：${[...spokeMembersThisRound].join(", ") || "なし"}。次のアクションをJSONで返してください。` },
    ];
    try {
      const data = await callAPI(msgs, buildOrchestratorPrompt(currentActiveMembers), 100);
      const raw = data.content[0].text.trim();
      return JSON.parse(raw.match(/\{.*\}/s)?.[0] || raw);
    } catch { return { action:"done", comment:"" }; }
  }, [callAPI]);

  // ── ラウンド1：ONメンバーが順番に発言 ──
  const runRound1 = useCallback(async (startIndex, initialContext, pipeline) => {
    setIsRunning(true); setError(""); setResumeFrom(null); setRoundDone(false);
    setModeLabel("全員発言モード");
    const context = [...initialContext];
    try {
      for (let i = startIndex; i < pipeline.length; i++) {
        const agentId = pipeline[i], agent = agentsMap[agentId];
        const text = await callAgent(agentId, context, ROUND1_SUFFIX);
        const msg = { agentId, name:agent.name, role:agent.role, text, time:new Date().toTimeString().slice(0,8) };
        addMsg(msg); context.push(msg);
        setSavedContext([...context]); setResumeFrom(i + 1);
        if (i < pipeline.length - 1) await new Promise(r => setTimeout(r, 4000));
      }
      addMsg({ agentId:"system", text:"✅ ラウンド1完了！追加情報があれば入力してから「次のラウンドへ」を押してください。", isSystem:true });
      setResumeFrom(null); setRoundDone(true);
    } catch (e) {
      setError(e.message);
      addMsg({ agentId:"system", text:`中断しました。「再開」ボタンで続きから再試行できます。`, isSystem:true, isError:true });
    }
    setThinkingAgent(null); setIsRunning(false);
  }, [callAgent]);

  // ── ラウンド2以降：自由討議＋主治医監視 ──
  const runFreeRound = useCallback(async (initialContext, currentActiveAgents) => {
    setIsRunning(true); setError(""); setRoundDone(false);
    setModeLabel("自由討議モード");
    const context = [...initialContext];
    const currentActiveMembers = currentActiveAgents.filter(id => !agentsMap[id].isOrchestrator);
    const spokeMembersThisRound = new Set();
    const MAX_TURNS = 14;
    let turns = 0;
    try {
      while (turns < MAX_TURNS) {
        turns++;
        const lastMsg = context[context.length - 1];
        let spontaneousResponder = null;

        if (lastMsg && lastMsg.agentId !== "user" && lastMsg.agentId !== "system") {
          const candidates = currentActiveMembers.filter(id => id !== lastMsg.agentId);
          const unspokeFirst = [
            ...candidates.filter(id => !spokeMembersThisRound.has(id)),
            ...candidates.filter(id => spokeMembersThisRound.has(id)),
          ].slice(0, 3);

          for (const candidateId of unspokeFirst) {
            setThinkingAgent(candidateId);
            const wants = await checkSpontaneous(candidateId, context);
            setThinkingAgent(null);
            if (wants) { spontaneousResponder = candidateId; break; }
            await new Promise(r => setTimeout(r, 500));
          }
        }

        if (spontaneousResponder) {
          const agent = agentsMap[spontaneousResponder];
          addMsg({ agentId:"system", text:`💬 ${agent.name}が自発的に発言`, isSystem:true });
          const text = await callAgent(spontaneousResponder, context);
          const msg = { agentId:spontaneousResponder, name:agent.name, role:agent.role, text, time:new Date().toTimeString().slice(0,8) };
          addMsg(msg); context.push(msg);
          spokeMembersThisRound.add(spontaneousResponder);
          setSavedContext([...context]);
          await new Promise(r => setTimeout(r, 3000));
        } else {
          setThinkingAgent(orchestratorId);
          const decision = await askOrchestrator(context, spokeMembersThisRound, currentActiveAgents);
          setThinkingAgent(null);

          if (decision.action === "done") {
            break;
          } else if (decision.action === "intervene") {
            const orch = agentsMap[orchestratorId];
            addMsg({ agentId:"system", text:"⚠ 主治医が議論に介入します", isSystem:true });
            addMsg({ agentId:orchestratorId, name:orch.name, role:orch.role, text:decision.comment, time:new Date().toTimeString().slice(0,8) });
            context.push({ agentId:orchestratorId, name:orch.name, role:orch.role, text:decision.comment });
            spokeMembersThisRound.clear();
            await new Promise(r => setTimeout(r, 3000));
          } else if (decision.action === "direct") {
            const targetId = decision.target;
            if (!agentsMap[targetId] || !currentActiveAgents.includes(targetId)) break;
            if (decision.comment) {
              const orch = agentsMap[orchestratorId];
              addMsg({ agentId:orchestratorId, name:orch.name, role:orch.role, text:decision.comment, time:new Date().toTimeString().slice(0,8) });
              context.push({ agentId:orchestratorId, name:orch.name, role:orch.role, text:decision.comment });
              await new Promise(r => setTimeout(r, 2000));
            }
            const text = await callAgent(targetId, context);
            const agent = agentsMap[targetId];
            const msg = { agentId:targetId, name:agent.name, role:agent.role, text, time:new Date().toTimeString().slice(0,8) };
            addMsg(msg); context.push(msg);
            spokeMembersThisRound.add(targetId);
            setSavedContext([...context]);
            await new Promise(r => setTimeout(r, 3000));
          }
        }
      }
      addMsg({ agentId:"system", text:`✅ ラウンド完了！追加情報があれば入力してから「次のラウンドへ」を押してください。`, isSystem:true });
      setRoundDone(true); setSavedContext(context);
    } catch (e) {
      setError(e.message);
      addMsg({ agentId:"system", text:`エラーで中断しました。`, isSystem:true, isError:true });
    }
    setThinkingAgent(null); setIsRunning(false);
  }, [callAgent, checkSpontaneous, askOrchestrator, orchestratorId]);

  const handleStart = useCallback(() => {
    if (!taskInput.trim() || !apiKeyRef.current.trim() || isRunning) return;
    const pipeline = [orchestratorId, ...activeMembers];
    const ctx = [{ agentId:"user", name:"病院薬剤師", role:"相談者", text:taskInput }];
    setMessages([]); setSavedContext(ctx); setRound(1); setRoundDone(false);
    addMsg({ agentId:"system", text:`カンファレンス開始：「${taskInput}」`, isSystem:true });
    addMsg({ agentId:"system", text:`参加メンバー：${pipeline.map(id=>agentsMap[id].name).join("、")}`, isSystem:true });
    runRound1(0, ctx, pipeline);
  }, [taskInput, isRunning, orchestratorId, activeMembers, runRound1]);

  const handleNextRound = useCallback(() => {
    if (isRunning || !roundDone) return;
    const nextRound = round + 1; setRound(nextRound);
    let ctx = [...savedContext];
    if (userNote.trim()) {
      ctx.push({ agentId:"user", name:"病院薬剤師", role:"相談者", text:`【追加情報】${userNote.trim()}` });
      addMsg({ agentId:"system", text:`病院薬剤師より：「${userNote.trim()}」`, isSystem:true });
      setUserNote("");
    }
    ctx.push({ agentId:"user", name:"システム", role:"", text:`ラウンド${nextRound}開始。前回の議論を踏まえ、さらに深掘りしてください。` });
    setSavedContext(ctx);
    addMsg({ agentId:"system", text:`── ラウンド ${nextRound} 開始（自由討議＋主治医監視） ──`, isSystem:true });
    runFreeRound(ctx, activeAgents);
  }, [isRunning, roundDone, round, savedContext, userNote, activeAgents, runFreeRound]);

  const handleResume = useCallback(() => {
    if (isRunning || resumeFrom === null) return;
    const pipeline = [orchestratorId, ...activeMembers];
    if (resumeFrom >= pipeline.length) return;
    addMsg({ agentId:"system", text:`${agentsMap[pipeline[resumeFrom]]?.name}から再開します...`, isSystem:true });
    runRound1(resumeFrom, savedContext, pipeline);
  }, [isRunning, resumeFrom, savedContext, orchestratorId, activeMembers, runRound1]);

  const doneAgents   = new Set(messages.filter(m => !m.isSystem && m.agentId).map(m => m.agentId));
  const canStart     = taskInput.trim() && apiKey.trim() && !isRunning && activeAgents.length > 1;
  const canResume    = !isRunning && resumeFrom !== null && apiKey.trim();
  const canNextRound = !isRunning && roundDone && apiKey.trim();

  function renderMarkdown(text) {
    return text.split(/(\*\*.*?\*\*|\*.*?\*)/g).map((part, i) => {
      if (part.startsWith("**") && part.endsWith("**")) return <strong key={i} style={{fontWeight:700,color:"#e8f0f8"}}>{part.slice(2,-2)}</strong>;
      if (part.startsWith("*")  && part.endsWith("*"))  return <em key={i} style={{fontStyle:"italic",color:"#d0dde8"}}>{part.slice(1,-1)}</em>;
      return part;
    });
  }

  const S = {
    root:     { fontFamily:"'Hiragino Sans','Noto Sans JP',sans-serif", background:"#0d1117", color:"#e6edf3", minHeight:"100vh", display:"flex", flexDirection:"column" },
    header:   { display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 18px", borderBottom:"1px solid #252d3d", background:"#111827" },
    grid:     { display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))", gap:7, padding:10 },
    card:     (a,t,d,enabled) => ({ borderRadius:8, padding:9, border:"1px solid #252d3d", borderLeft:`3px solid ${enabled?a.color:"#333"}`, background:enabled?a.bgAlpha:"rgba(30,30,30,0.3)", position:"relative", transition:"box-shadow .4s,opacity .4s", opacity:t?1:enabled?(d?.9:.55):.3, boxShadow:t?`0 0 20px ${a.color}66`:"none", cursor:a.isOrchestrator?"default":"pointer" }),
    dot:      (t,d,enabled) => ({ position:"absolute", top:8, right:8, width:7, height:7, borderRadius:"50%", background:t?"#c8a84a":enabled?(d?"#4a7a5a":"#555"):"#2a2a2a", animation:t?"pulse 1.8s infinite":"none" }),
    avatar:   (color,sz=32,enabled=true) => ({ width:sz, height:sz, borderRadius:"50%", background:enabled?color:"#2a2a2a", display:"flex", alignItems:"center", justifyContent:"center", fontSize:sz*.28, fontWeight:700, color:enabled?"#fff":"#555", flexShrink:0, border:`1px solid ${enabled?color+"88":"#333"}` }),
    chat:     { borderTop:"1px solid #252d3d", padding:"12px 16px", display:"flex", flexDirection:"column", gap:14, flex:1, overflowY:"auto", maxHeight:"calc(100vh - 480px)", minHeight:180 },
    inputBar: { borderTop:"1px solid #252d3d", padding:"10px 12px", background:"#111827", display:"flex", flexDirection:"column", gap:8 },
    input:    { background:"#0d1117", border:"1px solid #252d3d", borderRadius:6, color:"#e6edf3", padding:"7px 10px", fontSize:13, flex:1, outline:"none" },
    btn:      (dis,bg="#2a6496") => ({ padding:"7px 14px", borderRadius:6, border:"none", cursor:dis?"not-allowed":"pointer", background:dis?"#1e2433":bg, color:dis?"#445":"#fff", fontWeight:700, fontSize:13, transition:"background .2s", whiteSpace:"nowrap" }),
    footer:   { display:"flex", alignItems:"center", gap:12, padding:"6px 16px", borderTop:"1px solid #252d3d", fontSize:11, color:"#4a6a7a", flexWrap:"wrap" },
  };

  const pipeline = [orchestratorId, ...activeMembers];

  return (
    <div style={S.root}>
      <style>{`@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.2}} @keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}} ::-webkit-scrollbar{width:5px} ::-webkit-scrollbar-thumb{background:#252d3d;border-radius:3px}`}</style>

      <div style={S.header}>
        <div>
          <div style={{fontSize:15,fontWeight:800,letterSpacing:"0.08em",color:"#c8d8e8"}}>🏥 医療カンファレンス AI</div>
          <div style={{fontSize:10,color:"#5a7a9a",letterSpacing:"0.15em"}}>MULTI-PROFESSIONAL CASE CONFERENCE SYSTEM</div>
        </div>
        <span style={{fontSize:11,color:isRunning?"#c8a84a":canResume?"#7c5c8a":"#4a8a5a",letterSpacing:"0.08em"}}>
          {isRunning?"⚡ RUNNING":canResume?"⏸ PAUSED":roundDone?"✅ ROUND DONE":"● STANDBY"}
        </span>
      </div>

      {/* エージェントカード（ON/OFFトグル付き） */}
      <div style={S.grid}>
        {ALL_AGENTS.map(agent => {
          const enabled  = agentEnabled[agent.id];
          const thinking = thinkingAgent === agent.id;
          const done     = doneAgents.has(agent.id);
          const isNext   = canResume && pipeline[resumeFrom] === agent.id;
          return (
            <div key={agent.id} style={S.card(agent,thinking,done,enabled)}
              onClick={() => toggleAgent(agent.id)}
              title={agent.isOrchestrator ? "主治医は常時参加" : (enabled ? "クリックでOFF" : "クリックでON")}>
              <div style={S.dot(thinking,done,enabled)}/>
              {/* ONOFFバッジ */}
              {!agent.isOrchestrator && (
                <div style={{position:"absolute",top:6,right:18,fontSize:9,background:enabled?"#2a6a3a":"#3a2a2a",color:enabled?"#6dcc8a":"#666",borderRadius:3,padding:"1px 5px",fontWeight:700,border:`1px solid ${enabled?"#3a8a4a":"#444"}`}}>
                  {enabled?"ON":"OFF"}
                </div>
              )}
              {agent.isOrchestrator && (
                <div style={{position:"absolute",top:6,right:18,fontSize:9,background:"#1a3a5a",color:"#6aaad4",borderRadius:3,padding:"1px 5px",fontWeight:700}}>進行役</div>
              )}
              {done&&!thinking && <div style={{position:"absolute",top:20,right:18,fontSize:9,color:"#4a7a5a",fontWeight:700}}>✓</div>}
              {isNext && <div style={{position:"absolute",top:20,right:18,fontSize:9,background:"#c8a84a",color:"#000",borderRadius:3,padding:"1px 4px",fontWeight:700}}>NEXT</div>}
              <div style={{display:"flex",gap:7,alignItems:"center",marginBottom:5}}>
                <div style={S.avatar(agent.color,30,enabled)}>{agent.initial}</div>
                <div style={{minWidth:0}}>
                  <div style={{fontSize:11,fontWeight:700,color:enabled?agent.textColor:"#555",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{agent.name}</div>
                  <div style={{fontSize:9,color:enabled?"#4a6a7a":"#3a3a3a"}}>{agent.role}</div>
                </div>
              </div>
              <div style={{fontSize:9,lineHeight:1.4,color:thinking?"#c8a84a":done?"#4a7a5a":enabled?"#7a8a9a":"#3a3a3a"}}>
                {thinking?"🔮 思考中...":done?"✔ 発言済":enabled?`参加中`:`不参加`}
              </div>
            </div>
          );
        })}
      </div>

      {/* チャット */}
      <div style={S.chat} ref={chatRef}>
        {messages.length===0 && (
          <div style={{color:"#3a5a6a",fontSize:12,textAlign:"center",marginTop:20,lineHeight:2.2}}>
            🏥 カンファレンスメンバーを選んで相談内容を入力してください<br/>
            <span style={{fontSize:10}}>病院薬剤師の立場から多職種チームに相談できます</span>
          </div>
        )}
        {messages.map(msg => {
          if (msg.isSystem) return (
            <div key={msg.id} style={{textAlign:"center",fontSize:11,color:msg.isError?"#a05050":"#3a5a6a",animation:"fadeUp .3s ease"}}>
              ── {msg.text} ──
            </div>
          );
          const agent = agentsMap[msg.agentId];
          const isUser = msg.agentId === "user";
          if (!agent && !isUser) return null;
          const displayColor = agent ? agent.color : "#4a7a5a";
          const displayTextColor = agent ? agent.textColor : "#74c69d";
          const displayInitial = agent ? agent.initial : "薬";
          const displayName = agent ? agent.name : "病院薬剤師";
          const displayRole = agent ? agent.role : "相談者";
          return (
            <div key={msg.id} style={{display:"flex",gap:10,animation:"fadeUp .35s ease", flexDirection: isUser?"row-reverse":"row"}}>
              <div style={S.avatar(displayColor,28)}>{displayInitial}</div>
              <div style={{flex:1, textAlign:isUser?"right":"left"}}>
                <div style={{display:"flex",gap:8,alignItems:"baseline",marginBottom:3,flexDirection:isUser?"row-reverse":"row"}}>
                  <span style={{fontSize:12,fontWeight:700,color:displayTextColor}}>{displayName}</span>
                  <span style={{fontSize:9,color:"#4a6a7a"}}>{displayRole}</span>
                  <span style={{fontSize:9,color:"#3a4a5a"}}>{msg.time}</span>
                </div>
                <div style={{fontSize:13,lineHeight:1.75,color:"#c8d8e0"}}>{renderMarkdown(msg.text)}</div>
              </div>
            </div>
          );
        })}
        {thinkingAgent&&agentsMap[thinkingAgent]&&(()=>{ const a=agentsMap[thinkingAgent]; return (
          <div style={{display:"flex",gap:10,alignItems:"center",animation:"fadeUp .3s ease"}}>
            <div style={S.avatar(a.color,28)}>{a.initial}</div>
            <span style={{fontSize:12,color:a.textColor}}>{a.name}</span>
            <span style={{fontSize:18,color:"#2a3a4a",letterSpacing:4}}>・・・</span>
          </div>
        ); })()}
      </div>

      {/* 入力エリア */}
      <div style={S.inputBar}>
        {/* APIキー */}
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <span style={{fontSize:11,color:"#4a6a7a",whiteSpace:"nowrap"}}>API Key:</span>
          <input type={showApiKey?"text":"password"} placeholder="sk-ant-api...（一度保存すれば次回から自動入力）"
            value={apiKey} onChange={e=>{setApiKey(e.target.value);setKeySaved(false);}}
            style={{...S.input,fontFamily:"monospace",fontSize:12}}/>
          <button onClick={()=>setShowApiKey(v=>!v)} style={S.btn(false,"#252d3d")}>{showApiKey?"隠す":"表示"}</button>
          <button onClick={()=>{localStorage.setItem(STORAGE_KEY,apiKey);setKeySaved(true);}} style={S.btn(false,keySaved?"#2a5a2a":"#2a4a6a")}>
            {keySaved?"✓ 保存済":"💾 保存"}
          </button>
        </div>

        {/* 相談内容入力 */}
        <div style={{display:"flex",gap:8}}>
          <input type="text" placeholder="相談内容を入力（例：80歳男性、多剤併用で転倒リスクあり、退院調整について）"
            value={taskInput} onChange={e=>setTaskInput(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&canStart&&handleStart()}
            style={S.input} disabled={isRunning}/>
          {canResume && <button onClick={handleResume} style={S.btn(false,"#7c5c8a")}>↩ 再開</button>}
          <button onClick={handleStart} disabled={!canStart} style={S.btn(!canStart,"#2a6496")}>
            {isRunning?"開催中...":"🏥 カンファ開始"}
          </button>
        </div>

        {/* 追加発言欄（ラウンド完了後） */}
        {canNextRound && (
          <div style={{display:"flex",gap:8,alignItems:"center",background:"rgba(42,100,150,0.08)",border:"1px solid #252d3d",borderRadius:6,padding:"8px 10px"}}>
            <span style={{fontSize:11,color:"#6baed6",whiteSpace:"nowrap"}}>💊 追加情報：</span>
            <input type="text" placeholder="病院薬剤師として追加情報・意見を入力（省略可）"
              value={userNote} onChange={e=>setUserNote(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&handleNextRound()}
              style={S.input}/>
            <button onClick={handleNextRound} style={S.btn(false,"#2a6a4a")}>▶ ラウンド{round+1}へ</button>
          </div>
        )}

        {error && <div style={{fontSize:11,color:"#a05050"}}>⚠ {error}　→ 「再開」ボタンで続きから試せます</div>}
      </div>

      {/* フッター */}
      <div style={S.footer}>
        <span style={{color:isRunning?"#c8a84a":canResume?"#7c5c8a":roundDone?"#2a6496":"#4a8a5a"}}>
          {isRunning?"⚡ Conference Running":canResume?"⏸ Paused":roundDone?"✅ Round Done":"● Ready"}
        </span>
        {countdown>0 && <span style={{color:"#c8a84a",fontWeight:700}}>⏳ リトライまで {countdown}秒...</span>}
        <span>参加：{activeAgents.length}名</span>
        <span>{messages.filter(m=>!m.isSystem).length} 発言</span>
        <span>Round {round} {modeLabel?`（${modeLabel}）`:""}</span>
        <span style={{marginLeft:"auto"}}>医療カンファレンス AI v1.0</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<MedicalConference />);
</script>
</body>
</html>
